name: publish
# Wheels for PyPI, built on the three operating systems the library supports.
#
# WHY NOT cibuildwheel. That tool exists to build one C extension per Python version per platform,
# and this package is not that: the binding is ctypes, so a single `py3-none-<platform>` wheel
# serves every interpreter on that platform. What varies is the SHARED LIBRARY inside, which CMake
# must build natively on each system. So the matrix is three operating systems, one wheel each,
# and the Python version used to build is irrelevant to the result.
#
# EVERY PUSH BUILDS, NOTHING PUBLISHES. The wheels are uploaded as artifacts so they can be
# installed and tried before anything reaches PyPI, where a version number can never be reused.
# Publishing happens only for a pushed tag, and through Trusted Publishing: GitHub proves the
# workflow's identity to PyPI directly, so there is no API token in this repository to leak.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            manylinux: true
          - os: macos-latest
            name: macos-arm64
            macos: true
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LINUX BUILDS INSIDE MANYLINUX, THE OTHERS DO NOT. PyPI refuses a wheel tagged
      # `linux_x86_64`, because nothing about it says which glibc it needs; the manylinux images
      # exist to pin an old one, and `auditwheel` then rewrites the tag to what the binary really
      # requires. macOS and Windows have no equivalent problem - their platform tags already carry
      # the compatibility floor - so they build directly on the runner.
      - name: Build the library and the wheel inside manylinux
        if: matrix.manylinux
        shell: bash
        run: |
          docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux_2_28_x86_64 bash -euo pipefail -c '
            PY=/opt/python/cp312-cp312/bin/python
            # The image ships an old CMake; pip has current ones and they are the same toolchain
            # the other two runners use.
            "$PY" -m pip install --quiet --upgrade pip build wheel auditwheel cmake ninja
            export PATH="$("$PY" -c "import sysconfig;print(sysconfig.get_path(\"scripts\"))"):$PATH"
            cmake --preset release
            cmake --build --preset release --parallel
            cd bindings/python
            "$PY" -m build --wheel --outdir raw
            # auditwheel rewrites the tag to the glibc the binary actually needs, and vendors any
            # shared library it links. It expects an extension module, and ours is loaded through
            # ctypes instead, so if it declines the wheel the tag is set directly: the build ran
            # inside the manylinux image, which is exactly what that tag asserts.
            if ! "$PY" -m auditwheel repair raw/*.whl --plat manylinux_2_28_x86_64 -w dist; then
              echo "auditwheel declined the wheel; tagging it directly"
              "$PY" -m wheel tags --platform-tag manylinux_2_28_x86_64 --remove raw/*.whl
              mkdir -p dist && mv raw/*.whl dist/
            fi
          '
          ls -la bindings/python/dist

      - name: Build the library
        if: '!matrix.manylinux'
        shell: bash
        # macOS 11 is the floor this is compiled against. Without it the compiler targets whatever
        # the runner happens to be - macOS 26 today - and the wheel then refuses to install on
        # almost every Mac in existence.
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the wheel
        if: '!matrix.manylinux'
        shell: bash
        working-directory: bindings/python
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir dist

      # THE macOS TAG IS A CLAIM, AND THE DEFAULT ONE IS FALSE. setuptools derives the platform tag
      # from the interpreter, and the runner's Python is itself universal2, so the wheel comes out
      # `macosx_26_0_universal2`: it promises Intel code that is not in there, and demands a macOS
      # version almost nobody runs. The library is arm64, compiled against the 11.0 floor above,
      # so the tag is corrected to say exactly that. An Intel Mac then correctly finds no wheel
      # rather than installing one that cannot load.
      - name: Say what the macOS wheel actually is
        if: matrix.macos
        shell: bash
        working-directory: bindings/python
        run: |
          file dist/../../../build/release/libneurelease.dylib || true
          python -m wheel tags --platform-tag macosx_11_0_arm64 --remove dist/*.whl
          ls -la dist

      # THE WHEEL IS INSTALLED SOMEWHERE ELSE AND USED. A wheel that builds and then cannot find
      # its own library is the failure this package is most exposed to, and it looks like success
      # right up to the first import. The test runs from a directory that is not the repository,
      # so nothing can fall back to the build tree.
      - name: Install it clean and parse a name
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/check"
          if [ -x "${RUNNER_TEMP}/check/bin/python" ]; then
            PY="${RUNNER_TEMP}/check/bin/python"
          else
            PY="${RUNNER_TEMP}/check/Scripts/python.exe"
          fi
          "$PY" -m pip install --quiet bindings/python/dist/*.whl
          cd "${RUNNER_TEMP}"
          "$PY" -c "
          import neurelease
          result = neurelease.Parser().parse('Ted.Lasso.S03E03.4-5-1.1080p.ATVP.WEB-DL.DDP5.1.H.264-NTb')
          fields = result.to_dict()
          assert fields['title'] == 'Ted Lasso', fields
          assert fields['season'] == 3 and fields['episode'] == 3, fields
          assert fields['anime'] is False, fields
          print('wheel works:', neurelease.__file__)
          print(fields)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  publish:
    # Only for a tag, and only after all three wheels built and proved themselves.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing: the OIDC token PyPI verifies. No secrets.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
