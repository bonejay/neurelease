name: publish
# Wheels for PyPI, one per platform the library supports.
#
# WHY NOT cibuildwheel. That tool exists to build one C extension per Python version per platform,
# and this package is not that: the binding is ctypes, so a single `py3-none-<platform>` wheel
# serves every interpreter on that platform. What varies is the SHARED LIBRARY inside, which CMake
# must build natively on each system. So the matrix is one wheel per platform, and the Python
# version used to build is irrelevant to the result.
#
# EVERY PUSH BUILDS, NOTHING PUBLISHES. The wheels are uploaded as artifacts so they can be
# installed and tried before anything reaches PyPI, where a version number can never be reused.
# Publishing happens only for a pushed tag, and through Trusted Publishing: GitHub proves the
# workflow's identity to PyPI directly, so there is no API token in this repository to leak.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    # ONE VERSION, WRITTEN TWICE, CHECKED HERE. CMakeLists.txt and pyproject.toml each carry it and
    # nothing keeps them together but this job. For a tag it must also be the tag, and CHANGELOG.md
    # must have the section that becomes the GitHub release's notes - a release with a blank page
    # is how GitHub came to show 0.1.1 as the latest for a month after 0.2.0 shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The versions agree
        shell: bash
        run: |
          cmake_version=$(sed -n 's/^project(neurelease VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          python_version=$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml)
          echo "CMakeLists.txt: $cmake_version  pyproject.toml: $python_version"
          if [ -z "$cmake_version" ] || [ "$cmake_version" != "$python_version" ]; then
            echo "::error::CMakeLists.txt says '$cmake_version' and pyproject.toml says '$python_version'"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$python_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $python_version"
              exit 1
            fi
            if ! grep -q "^## $python_version " CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## $python_version - <date>' section"
              exit 1
            fi
          fi

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # LINUX BUILDS INSIDE THE PyPA IMAGES, glibc (manylinux) and musl (musllinux, for Alpine
          # and the containers built on it), each natively on its own architecture: the ARM
          # runners are real ARM machines, so nothing is emulated and the wheel is tested where
          # it will run.
          - os: ubuntu-latest
            name: manylinux-x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
            platform: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            name: manylinux-aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
            platform: manylinux_2_28_aarch64
          - os: ubuntu-latest
            name: musllinux-x86_64
            image: quay.io/pypa/musllinux_1_2_x86_64
            platform: musllinux_1_2_x86_64
            musl: true
          - os: ubuntu-24.04-arm
            name: musllinux-aarch64
            image: quay.io/pypa/musllinux_1_2_aarch64
            platform: musllinux_1_2_aarch64
            musl: true
          - os: macos-latest
            name: macos-arm64
            platform: macosx_11_0_arm64
          - os: macos-15-intel
            name: macos-x86_64
            platform: macosx_11_0_x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LINUX BUILDS INSIDE THE IMAGE, THE OTHERS DO NOT. PyPI refuses a wheel tagged
      # `linux_x86_64`, because nothing about it says which libc it needs; the images exist to pin
      # an old one, and `auditwheel` then rewrites the tag to what the binary really requires.
      # macOS and Windows have no equivalent problem - their platform tags already carry the
      # compatibility floor - so they build directly on the runner.
      #
      # ON MUSL, libstdc++ IS LINKED IN. Alpine installs no C++ runtime by default, so a library
      # that needs libstdc++.so.6 fails at import on exactly the systems this wheel is for. The
      # glibc wheels keep it dynamic: every glibc system has one, and the manylinux toolchain
      # already links statically whatever is newer than the floor's.
      - name: Build the library and the wheel inside ${{ matrix.image }}
        if: matrix.image
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          LINK_FLAGS: ${{ matrix.musl && '-static-libstdc++ -static-libgcc' || '' }}
        run: |
          docker run --rm -e PLATFORM -e LINK_FLAGS -v "$PWD:/io" -w /io "$IMAGE" bash -euo pipefail -c '
            PY=/opt/python/cp312-cp312/bin/python
            # The images ship an old CMake; pip has current ones and they are the same toolchain
            # the other runners use.
            "$PY" -m pip install --quiet --upgrade pip build wheel auditwheel cmake ninja
            export PATH="$("$PY" -c "import sysconfig;print(sysconfig.get_path(\"scripts\"))"):$PATH"
            cmake --preset release -DCMAKE_SHARED_LINKER_FLAGS="$LINK_FLAGS"
            cmake --build --preset release --parallel
            cd bindings/python
            "$PY" -m build --wheel --outdir raw
            # auditwheel rewrites the tag to the libc the binary actually needs, and vendors any
            # shared library it links. It expects an extension module, and ours is loaded through
            # ctypes instead, so if it declines the wheel the tag is set directly: the build ran
            # inside the image, which is exactly what that tag asserts. The clean install below
            # is what proves the claim.
            if ! "$PY" -m auditwheel repair raw/*.whl --plat "$PLATFORM" -w dist; then
              echo "auditwheel declined the wheel; tagging it directly"
              "$PY" -m wheel tags --platform-tag "$PLATFORM" --remove raw/*.whl
              mkdir -p dist && mv raw/*.whl dist/
            fi
          '
          ls -la bindings/python/dist

      - name: Build the library
        if: '!matrix.image'
        shell: bash
        # macOS 11 is the floor this is compiled against. Without it the compiler targets whatever
        # the runner happens to be - macOS 26 today - and the wheel then refuses to install on
        # almost every Mac in existence.
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the wheel
        if: '!matrix.image'
        shell: bash
        working-directory: bindings/python
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir dist

      # THE macOS TAG IS A CLAIM, AND THE DEFAULT ONE IS FALSE. setuptools derives the platform tag
      # from the interpreter, and the runner's Python is itself universal2, so the wheel comes out
      # `macosx_26_0_universal2`: it promises code for an architecture that is not in there, and
      # demands a macOS version almost nobody runs. Each runner builds its own architecture
      # against the 11.0 floor above, so the tag is corrected to say exactly that.
      - name: Say what the macOS wheel actually is
        if: startsWith(matrix.os, 'macos')
        shell: bash
        working-directory: bindings/python
        run: |
          file ../../build/release/libneurelease.dylib || true
          python -m wheel tags --platform-tag "${{ matrix.platform }}" --remove dist/*.whl
          ls -la dist

      # THE WHEEL IS INSTALLED SOMEWHERE ELSE AND USED. A wheel that builds and then cannot find
      # its own library is the failure this package is most exposed to, and it looks like success
      # right up to the first import. The check runs from a directory that is not the repository,
      # so nothing can fall back to the build tree. A musl wheel cannot install on the runner's
      # glibc, so it is tried in a stock Alpine Python instead - which, having no C++ runtime, is
      # also the test that libstdc++ really was linked in.
      - name: Install it clean and parse a name
        if: '!matrix.musl'
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/check"
          if [ -x "${RUNNER_TEMP}/check/bin/python" ]; then
            PY="${RUNNER_TEMP}/check/bin/python"
          else
            PY="${RUNNER_TEMP}/check/Scripts/python.exe"
          fi
          "$PY" -m pip install --quiet bindings/python/dist/*.whl
          cd "${RUNNER_TEMP}"
          "$PY" "${GITHUB_WORKSPACE}/.github/scripts/wheel_smoke.py"

      - name: Install it clean on Alpine and parse a name
        if: matrix.musl
        shell: bash
        run: |
          docker run --rm -v "$PWD:/io:ro" -w /tmp python:3.12-alpine sh -euc '
            pip install --quiet --root-user-action=ignore /io/bindings/python/dist/*.whl
            python /io/.github/scripts/wheel_smoke.py
          '

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  publish:
    # Only for a tag, and only after every wheel built and proved itself.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing: the OIDC token PyPI verifies. No secrets.
      contents: write        # the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      # A rerun after PyPI already took the files - the release step below failing, say - must
      # not fail here on a version that is already up.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # THE GITHUB RELEASE IS THE SAME RELEASE. It used to be made by hand, and for 0.2.0 it was
      # not made at all, so the page PyPI links as the changelog went on describing 0.1.1. Its
      # notes are the CHANGELOG.md section for this version, and the same wheels are attached.
      # A release drafted by hand beforehand is filled in and published rather than duplicated.
      - name: The GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' \
            CHANGELOG.md > notes.md
          cat notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
            gh release edit "$GITHUB_REF_NAME" --title "NeuRelease $version" --notes-file notes.md \
              --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl --verify-tag \
              --title "NeuRelease $version" --notes-file notes.md --latest
          fi
