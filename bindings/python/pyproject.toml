[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurelease"
version = "0.2.0"
description = "A fast neural parser for torrent and release names"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Benedikt Jung" }]
keywords = ["parser", "release names", "torrent", "scene", "anime", "metadata", "neural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bonejay/neurelease"
Demo = "https://neurelease-demo.vercel.app"
Documentation = "https://github.com/bonejay/neurelease/blob/main/docs/API.md"
Issues = "https://github.com/bonejay/neurelease/issues"
Changelog = "https://github.com/bonejay/neurelease/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurelease*"]

[tool.pytest.ini_options]
# WEIGHT-SENSITIVE ASSERTIONS ARE MARKED, NOT DELETED. A `model` test asserts what the installed
# segmenter reads, which changes when the weights change — CI stayed red from the moment a new
# model shipped, for two assertions that describe the model rather than this source tree. The C++
# suite already labels those tests `model` and excludes them in the preset; this is the same rule
# for the binding suite. Run them deliberately: `pytest -m model`.
markers = [
    "model: asserts behaviour of the installed segmenter weights, not of the binding",
]
